<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Radio San Rafael</title>

<style>

body{
margin:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
font-family:Arial;
transition:background 2s;
overflow:hidden;
}

/* reloj */

#hora{
position:absolute;
top:10px;
left:20px;
color:blue;
font-size:26px;
font-weight:bold;
}

/* logo esquina */

#logoTop{
position:absolute;
top:10px;
right:20px;
width:90px;
}

/* logo central */

#logoCentral{
width:260px;
animation:latido 1.5s infinite;
}

/* latido */

@keyframes latido{
0%{transform:scale(1)}
25%{transform:scale(1.1)}
40%{transform:scale(1)}
60%{transform:scale(1.1)}
100%{transform:scale(1)}
}

/* botón */

#btnRadio{
margin:20px auto 0 auto;
padding:15px 35px;
background:#007BFF;
color:white;
border:none;
font-size:20px;
border-radius:12px;
cursor:pointer;
display:flex;
align-items:center;
justify-content:center;
gap:10px;
transition:all 0.3s ease;
box-shadow:0 5px 15px rgba(0,0,0,0.2);
}

/* animación cuando reproduce */

.playing{
background:red !important;
animation:pulse 1s infinite;
}

@keyframes pulse{
0%{transform:scale(1)}
50%{transform:scale(1.05)}
100%{transform:scale(1)}
}

/* volumen */

#volumenContainer{
margin-top:15px;
}

#volumen{
width:200px;
}

/* gif */

#gif{
position:absolute;
bottom:10px;
left:10px;
display:none;
}

#gif img{
width:120px;
}

/* contenido */

#contenido{
text-align:center;
}

/* twitch */

#twitchContainer{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
display:none;
}

#twitchContainer iframe{
width:100%;
height:100%;
border:none;
}

</style>
</head>

<body>

<div id="hora"></div>

<img src="logo.png" id="logoTop">

<div id="contenido">

<img src="logo.png" id="logoCentral">

<br>

<button id="btnRadio" onclick="playRadio()">
<span id="icono">▶️</span>
<span id="textoBtn">ESCUCHAR</span>
</button>

<div id="volumenContainer">
<input type="range" id="volumen" min="0" max="1" step="0.01" value="1">
</div>

<audio id="radio" src="https://stream.zeno.fm/sxnh0y4vgchvv"></audio>

</div>

<div id="gif">
<a href="https://alanjavier198245-debug.github.io/Confec4a./" target="_blank">
<img id="gifImg" src="">
</a>
</div>

<div id="twitchContainer">
<iframe
src="https://player.twitch.tv/?channel=sanrafaelradio1&parent=localhost&autoplay=true"
allowfullscreen>
</iframe>
</div>

<script>

/* reloj */

function reloj(){
let d=new Date();
let h=d.getHours().toString().padStart(2,"0");
let m=d.getMinutes().toString().padStart(2,"0");
let s=d.getSeconds().toString().padStart(2,"0");

document.getElementById("hora").innerHTML=h+":"+m+":"+s;
}
setInterval(reloj,1000);

/* radio */

function playRadio(){
let radio = document.getElementById("radio");
let btn = document.getElementById("btnRadio");
let icono = document.getElementById("icono");
let texto = document.getElementById("textoBtn");

if(radio.paused){
    radio.play().catch(e => console.log("Error:", e));
    icono.innerHTML = "⏸️";
    texto.innerHTML = "PAUSAR";
    btn.classList.add("playing");
}else{
    radio.pause();
    icono.innerHTML = "▶️";
    texto.innerHTML = "ESCUCHAR";
    btn.classList.remove("playing");
}
}

/* volumen */

let volumen = document.getElementById("volumen");
let radio = document.getElementById("radio");

volumen.addEventListener("input", function(){
radio.volume = this.value;
});

/* fondo dinámico SIN repetir */

const colores=["#1e3c72","#2a5298","#ff4b2b","#ff416c","#11998e","#38ef7d"];
let ultimoColor="";

function fondo(){
let c;
do{
    c = colores[Math.floor(Math.random()*colores.length)];
}while(c === ultimoColor);

ultimoColor = c;
document.body.style.background = c;
}

setInterval(fondo,4000);

/* GIFS ROTATIVOS */

const gifs = [
    "animacion1.gif",
    "animacion2.gif",
    "animacion3.gif"
];

let indiceGif = 0;

function mostrarGif(){
    let gifContainer = document.getElementById("gif");
    let gifImg = document.getElementById("gifImg");

    gifImg.src = gifs[indiceGif];
    gifContainer.style.display = "block";

    setTimeout(()=>{
        gifContainer.style.display = "none";
    },10000);

    indiceGif++;
    if(indiceGif >= gifs.length){
        indiceGif = 0;
    }
}

setInterval(mostrarGif, 300000); // 5 minutos

/* twitch */

function activarTwitch(){
document.getElementById("contenido").style.display="none";
document.getElementById("gif").style.display="none";
document.getElementById("twitchContainer").style.display="block";
}

</script>

</body>
</html>
